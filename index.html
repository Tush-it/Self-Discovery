<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Discovery | Neural Network</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- DEEP SYNAPSE THEME (Midnight Blue & Cyan) --- */
        :root {
            --c-text: #e2e8f0;       /* Crisp Slate White */
            --c-card: #0a1128;       /* Deep Navy Glass */
            --c-bg: #050914;         /* The Void (Almost black navy) */
            --c-accent: #00f2ff;     /* Electric Cyan */
            --c-highlight: #7000ff;  /* Deep Purple */
            
            --glass-bg: rgba(10, 17, 40, 0.65);
            --glass-border: rgba(0, 242, 255, 0.25);
            --glass-hover: rgba(0, 242, 255, 0.15);
            
            --active-gradient: linear-gradient(135deg, rgba(0, 242, 255, 0.1) 0%, rgba(112, 0, 255, 0.15) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--c-bg);
            color: var(--c-text);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- 3D CANVAS --- */
        #canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            
            /* HIDDEN FOR INTRO ANIMATION */
            opacity: 0;
            pointer-events: none;
            transition: opacity 2.5s ease;
        }

        #ui-layer.active {
            opacity: 1;
            pointer-events: all;
        }

        /* --- TOP NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            background: rgba(5, 9, 20, 0.6);
        }

        nav a {
            color: var(--c-accent);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: #fff;
            text-shadow: 0 0 15px var(--c-accent);
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            flex: 1;
        }

        /* --- GLASS CARDS (SMOOTH EDGES) --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, var(--glass-hover), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--c-accent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(0, 242, 255, 0.2);
        }

        .card:hover::before { opacity: 1; }

        .card.answered {
            border-left: 4px solid var(--c-highlight);
            background: var(--active-gradient);
        }

        .card-num {
            font-size: 0.9rem;
            color: var(--c-accent);
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .card.answered .card-num {
            color: #fff;
            text-shadow: 0 0 10px var(--c-highlight);
        }

        .card-question {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.5;
            color: #fff;
            z-index: 1;
        }

        /* --- BUTTONS --- */
        .btn-analyze {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 60px auto 0;
            padding: 18px 30px;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--c-accent), var(--c-highlight));
            color: #fff;
            border: none;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(112, 0, 255, 0.4);
        }

        .btn-analyze:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(0, 242, 255, 0.5);
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 9, 20, 0.85); 
            backdrop-filter: blur(25px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-box {
            width: 90%; max-width: 800px;
            background: rgba(10, 17, 40, 0.95);
            border: 1px solid var(--c-highlight);
            border-radius: 30px;
            padding: 50px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.4s;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(112, 0, 255, 0.15);
        }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .close-btn {
            position: absolute;
            top: 30px; right: 30px;
            background: none; border: none;
            color: var(--c-text);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s;
        }
        .close-btn:hover { color: var(--c-accent); }

        textarea {
            width: 100%; height: 200px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            padding: 25px; margin-top: 30px;
            resize: none; outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        textarea:focus { 
            border-color: var(--c-accent); 
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15); 
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            border: 1px solid var(--c-accent);
            background: transparent;
            color: #fff;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover { background: rgba(0, 242, 255, 0.1); }
        .btn.primary { background: var(--c-accent); border-color: var(--c-accent); color: #000; }
        .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 242, 255, 0.4); }

        /* Dictation Pulse */
        .btn.listening {
            border-color: #ff3366; color: #ff3366;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }

        /* --- AI REPORT UI --- */
        #ai-loader { text-align: center; color: var(--c-accent); font-size: 1.5rem; display: none; }
        .loader-dots::after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }

        .report-header { font-size: 2.5rem; color: var(--c-accent); font-weight: 800; margin-bottom: 15px; text-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .report-desc { font-size: 1.1rem; line-height: 1.6; color: var(--c-text); margin-bottom: 30px; }
        .report-tips { background: rgba(0, 0, 0, 0.4); padding: 25px; border-radius: 16px; border-left: 4px solid var(--c-highlight); }
        .report-tips h3 { color: var(--c-highlight); margin-bottom: 15px; }
        .report-tips p { margin-bottom: 10px; font-size: 1.05rem; display: flex; align-items: baseline; gap: 10px; }
        .report-tips i { color: var(--c-accent); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <nav>
            <a href="https://instagram.com/heybablubisht" target="_blank">(heybablubisht)</a>
            <div class="main-title">Self Discovery</div>
            <a href="https://instagram.com/its_yourcodebuddy" target="_blank">its_yourcodebuddy</a>
        </nav>

        <div class="container">
            <div class="grid" id="card-grid">
                </div>

            <button class="btn-analyze" onclick="generateAIReport()">
                Initialize AI Analysis
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="answer-modal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('answer-modal')">&times;</button>
            <h2 id="modal-title" style="font-size: 1.8rem; color: #fff;">Question</h2>
            <textarea id="modal-input" placeholder="Speak or type your thoughts freely. Do not overthink..."></textarea>
            
            <div class="action-row">
                <button class="btn" id="mic-btn" onclick="toggleDictation()">
                    <i class="fas fa-microphone"></i> <span id="mic-text">Dictate</span>
                </button>
                <button class="btn primary" onclick="saveAnswer()">Save Neural Data</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="report-modal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('report-modal')">&times;</button>
            
            <div id="ai-loader">
                <i class="fas fa-microchip" style="font-size: 3rem; margin-bottom: 20px;"></i><br>
                Running Deep Syntactic Analysis<span class="loader-dots"></span>
            </div>

            <div id="ai-content" style="display: none;">
                <div style="color: var(--c-highlight); font-weight: 800; letter-spacing: 2px; margin-bottom: 5px;">AI CORE ARCHETYPE</div>
                <div class="report-header" id="rep-title">The Creator</div>
                <div class="report-desc" id="rep-desc">Description text...</div>
                
                <div class="report-tips">
                    <h3>Growth & Optimization Protocols:</h3>
                    <div id="rep-tips">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. THREE.JS: PURE PARTICLE BRAIN + ORBITING RINGS
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050914, 0.02); // Deep Navy fog
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pGroup = new THREE.Group();
        scene.add(pGroup);

        // --- AMBIENT BACKGROUND DUST ---
        const dustCount = 1000;
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = [];
        for(let i = 0; i < dustCount; i++) {
            dustPos.push(
                (Math.random() - 0.5) * 200, 
                (Math.random() - 0.5) * 200, 
                (Math.random() - 0.5) * 100 - 30 
            );
        }
        dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({
            color: 0x00f2ff, 
            size: 0.12, 
            transparent: true, 
            opacity: 0.25,
            blending: THREE.AdditiveBlending
        });
        const dustSystem = new THREE.Points(dustGeo, dustMat);
        scene.add(dustSystem);

        // --- BRAIN PARTICLES ---
        const brainParticleCount = 8000; 
        const brainTargetPositions = [];
        const currentPositions = [];
        const particleColors = [];
        
        // Deep Synapse Palette
        const colorCyan = new THREE.Color(0x00f2ff);
        const colorPurple = new THREE.Color(0x7000ff);

        for(let i = 0; i < brainParticleCount; i++) {
            let u = Math.random() * Math.PI * 2;
            let v = Math.acos(Math.random() * 2 - 1);
            
            let r = 5 + (0.8 * Math.sin(u * 12) * Math.sin(v * 12)); 
            let depth = Math.random() * 0.2 + 0.8; 

            let x = r * Math.sin(v) * Math.cos(u) * depth;
            let y = r * Math.sin(v) * Math.sin(u) * 0.85 * depth; 
            let z = r * Math.cos(v) * 1.2 * depth; 

            if(x > 0.05) x += 0.4; else if(x < -0.05) x -= 0.4; 
            if(z > 1.5) { x *= 0.8; y *= 0.9; } 
            if(z < -1.0 && y < -1.0) { x *= 1.2; } 

            brainTargetPositions.push(new THREE.Vector3(x, y, z));
            
            currentPositions.push(new THREE.Vector3(
                (Math.random() - 0.5) * 150,
                (Math.random() - 0.5) * 150,
                (Math.random() - 0.5) * 150
            ));

            let mixedColor = colorPurple.clone().lerp(colorCyan, Math.random());
            particleColors.push(mixedColor.r, mixedColor.g, mixedColor.b);
        }

        const brainGeo = new THREE.BufferGeometry().setFromPoints(currentPositions);
        brainGeo.setAttribute('color', new THREE.Float32BufferAttribute(particleColors, 3));

        const brainMat = new THREE.PointsMaterial({
            size: 0.09,
            vertexColors: true,
            transparent: true, 
            opacity: 0.9,
            blending: THREE.AdditiveBlending 
        });

        const brainPoints = new THREE.Points(brainGeo, brainMat);
        pGroup.add(brainPoints);

        // --- ORBITING RINGS ---
        const ringsGroup = new THREE.Group();
        pGroup.add(ringsGroup); // Add to pGroup so it rotates with the brain

        const ringColors = [0x00f2ff, 0x7000ff, 0x00f2ff]; // Cyan, Purple, Cyan
        const ringRadii = [8.5, 9.5, 10.5]; // Outside the brain

        for(let i = 0; i < 3; i++) {
            const ringGeo = new THREE.BufferGeometry();
            const ringPts = [];
            for(let j = 0; j <= 64; j++) {
                const angle = (j / 64) * Math.PI * 2;
                ringPts.push(Math.cos(angle) * ringRadii[i], Math.sin(angle) * ringRadii[i], 0);
            }
            ringGeo.setAttribute('position', new THREE.Float32BufferAttribute(ringPts, 3));
            
            const ringMat = new THREE.LineBasicMaterial({
                color: ringColors[i],
                transparent: true,
                opacity: 0, // Starts hidden for intro
                blending: THREE.AdditiveBlending
            });
            
            const ring = new THREE.Line(ringGeo, ringMat);
            
            // Randomize starting angles to create the "gyroscope" effect
            ring.rotation.x = Math.random() * Math.PI;
            ring.rotation.y = Math.random() * Math.PI;
            
            ringsGroup.add(ring);
        }

        camera.position.z = 25;
        pGroup.position.y = 1;

        let time = 0;
        let isIntro = true;
        let introTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;
            
            const dPos = dustGeo.attributes.position.array;
            for(let i=0; i<dustCount; i++) {
                dPos[i*3+1] += 0.02; 
                dPos[i*3] += Math.sin(time + i) * 0.01; 
                if(dPos[i*3+1] > 100) dPos[i*3+1] = -100;
            }
            dustGeo.attributes.position.needsUpdate = true;

            if (isIntro) {
                introTimer += 0.01;
                
                // Form the brain
                for(let i = 0; i < brainParticleCount; i++) {
                    currentPositions[i].lerp(brainTargetPositions[i], 0.05);
                }
                brainGeo.setFromPoints(currentPositions);

                pGroup.rotation.y += 0.02;
                pGroup.rotation.x = Math.sin(time) * 0.1;

                // Reveal Rings during assembly
                if (introTimer > 1.5) {
                    ringsGroup.children.forEach((ring, index) => {
                        if(ring.material.opacity < 0.6) ring.material.opacity += 0.005;
                        ring.rotation.x += 0.01 * (index + 1);
                        ring.rotation.y += 0.015;
                    });
                }

                if (introTimer > 3.5) {
                    isIntro = false;
                    document.getElementById('ui-layer').classList.add('active');
                }

            } else {
                // Continuous Background Spin
                pGroup.rotation.y += 0.002;
                pGroup.rotation.x = Math.sin(time) * 0.1;
                
                let scale = 1 + Math.sin(time * 5) * 0.015;
                brainPoints.scale.set(scale, scale, scale); // Only pulse brain, not rings

                // Spin the rings continuously
                ringsGroup.children.forEach((ring, index) => {
                    ring.rotation.x += 0.002 * (index + 1);
                    ring.rotation.y += 0.003;
                });
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // ==========================================
        // 2. UI & QUESTION LOGIC
        // ==========================================
        const questions = [
            { id: 1, text: "Jab tum free hote ho, naturally kya karte ho?" },
            { id: 2, text: "Kaunsa kaam karte waqt time ka pata hi nahi chalta?" },
            { id: 3, text: "Tum kis type ke logon ko dekh ke sochte ho – 'kaash mai bhi aisa hota'?" },
            { id: 4, text: "Agar fail hone ka darr hi na ho, tum kya try karte?" },
            { id: 5, text: "Log tumse aksar kis cheez me help maangte hain?" },
            { id: 6, text: "Tum zyada bolne wale ho, likhne wale ho, ya observe karne wale?" },
            { id: 7, text: "Kaunsi cheez ke liye tum bina paise ke bhi mehnat kar sakte ho?" }
        ];

        let activeId = null;

        function renderGrid() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            questions.forEach(q => {
                const ans = localStorage.getItem(`sd_ans_${q.id}`);
                const isDone = ans && ans.length > 2;
                
                const card = document.createElement('div');
                card.className = `card ${isDone ? 'answered' : ''}`;
                card.onclick = () => openModal(q.id);
                
                card.innerHTML = `
                    <div class="card-num">0${q.id} ${isDone ? '— DATA LOGGED' : ''}</div>
                    <div class="card-question">${q.text}</div>
                `;
                grid.appendChild(card);
            });
        }
        renderGrid();

        function openModal(id) {
            activeId = id;
            const q = questions.find(x => x.id === id);
            document.getElementById('modal-title').innerText = q.text;
            document.getElementById('modal-input').value = localStorage.getItem(`sd_ans_${id}`) || "";
            document.getElementById('answer-modal').classList.add('active');
            stopDictation(); 
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            if(modalId === 'answer-modal') stopDictation();
        }

        function saveAnswer() {
            const text = document.getElementById('modal-input').value;
            localStorage.setItem(`sd_ans_${activeId}`, text);
            closeModal('answer-modal');
            renderGrid();
        }

        // ==========================================
        // 3. DICTATION (WEB SPEECH API)
        // ==========================================
        let recognition;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onresult = (e) => {
                let trans = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) trans += e.results[i][0].transcript;
                }
                if (trans) {
                    const box = document.getElementById('modal-input');
                    box.value += (box.value.endsWith(' ') || box.value=='' ? '' : ' ') + trans;
                }
            };
            
            recognition.onerror = (e) => {
                console.error(e.error);
                stopDictation();
            };
        }

        function toggleDictation() {
            if (!recognition) return alert("Browser does not support dictation.");
            if (isRecording) {
                stopDictation();
            } else {
                try {
                    recognition.start();
                    isRecording = true;
                    document.getElementById('mic-btn').classList.add('listening');
                    document.getElementById('mic-text').innerText = "Listening...";
                } catch(e) {}
            }
        }

        function stopDictation() {
            isRecording = false;
            if (recognition) { try{ recognition.stop(); }catch(e){} }
            const btn = document.getElementById('mic-btn');
            if(btn) {
                btn.classList.remove('listening');
                document.getElementById('mic-text').innerText = "Dictate";
            }
        }

        // ==========================================
        // 4. PROPER AI ANALYSIS ENGINE
        // ==========================================
        function generateAIReport() {
            let combinedText = "";
            let answered = 0;
            questions.forEach(q => {
                let ans = localStorage.getItem(`sd_ans_${q.id}`) || "";
                if (ans.trim().length > 2) {
                    combinedText += ans + " ";
                    answered++;
                }
            });

            if (answered < 3) {
                alert("Insufficient Neural Data: Please complete at least 3 nodes to generate a highly accurate AI personality assessment.");
                return;
            }

            document.getElementById('report-modal').classList.add('active');
            document.getElementById('ai-loader').style.display = 'block';
            document.getElementById('ai-content').style.display = 'none';

            // Simulate deep API processing delay
            setTimeout(() => {
                const report = analyzeText(combinedText.toLowerCase());
                
                document.getElementById('rep-title').innerText = report.title;
                document.getElementById('rep-desc').innerText = report.desc;
                document.getElementById('rep-tips').innerHTML = report.tips.map(t => `<p><i class="fas fa-bolt"></i> ${t}</p>`).join('');

                document.getElementById('ai-loader').style.display = 'none';
                document.getElementById('ai-content').style.display = 'block';
            }, 3000);
        }

        function analyzeText(text) {
            let scores = { architect: 0, empath: 0, kinetic: 0, creative: 0 };
            
            // Expanded, robust dictionary for proper AI logic
            const words = {
                architect: ['code', 'build', 'design', 'system', 'solve', 'plan', 'think', 'money', 'business', 'logic', 'strategy', 'future', 'data', 'pc', 'laptop', 'invest'],
                creative:  ['art', 'music', 'write', 'draw', 'imagine', 'idea', 'video', 'edit', 'photo', 'sing', 'dance', 'create', 'story'],
                empath:    ['people', 'help', 'talk', 'listen', 'friends', 'team', 'guide', 'share', 'family', 'teach', 'care', 'advice', 'support'],
                kinetic:   ['run', 'play', 'sport', 'travel', 'move', 'explore', 'action', 'gym', 'drive', 'ride', 'bike', 'outdoor', 'game', 'gta', 'compete']
            };

            for (let cat in words) {
                words[cat].forEach(w => { 
                    let regex = new RegExp('\\b' + w + '\\b', 'g');
                    let matches = text.match(regex);
                    if (matches) scores[cat] += matches.length; 
                });
            }

            // Fallback if responses are too generic
            let totalScore = Object.values(scores).reduce((a, b) => a + b, 0);
            if (totalScore === 0) {
                scores.architect = 1; 
            }

            let maxCat = 'architect';
            let maxScore = -1;
            for (let cat in scores) {
                if (scores[cat] > maxScore) { maxScore = scores[cat]; maxCat = cat; }
            }

            const profiles = {
                architect: {
                    title: "The Visionary Architect",
                    desc: "Based on semantic analysis, your mind operates like a high-end processor. You are fueled by logic, efficiency, and solving complex puzzles. You find 'flow' in building systems and structuring chaos into order.",
                    tips: [
                        "Lean heavily into high-leverage hard skills (Coding, Data Science, Finance).",
                        "Beware of 'Analysis Paralysis'. Sometimes executing a good plan today is better than waiting for a perfect plan tomorrow.",
                        "Remember that humans aren't algorithms. Practice emotional intelligence actively to balance your profound logic."
                    ]
                },
                creative: {
                    title: "The Genesis Creator",
                    desc: "Your neural pathways are optimized for divergent thinking. You see the world not as it is, but as raw material to build something new. You are fueled by originality, aesthetics, and raw expression.",
                    tips: [
                        "Protect your 'Deep Work' time. Creators require uninterrupted flow states to produce masterpieces.",
                        "Your weakness might be finishing projects. Partner with a 'System Architect' to help execute your visions.",
                        "Stop consuming content aimlessly; channel that energy to produce daily."
                    ]
                },
                empath: {
                    title: "The Empathic Catalyst",
                    desc: "Your neural network is highly attuned to human frequencies. You are a natural leader, listener, and healer. Your true power lies in elevating the people around you and building deep connections.",
                    tips: [
                        "Your empathy is a superpower, but your energy is your currency. Set strict boundaries.",
                        "Learn mass-communication skills (Public Speaking, Writing) to scale your impact beyond 1-on-1 interactions.",
                        "Don't lose your own identity while absorbing the emotions and problems of your tribe."
                    ]
                },
                kinetic: {
                    title: "The Unstoppable Force",
                    desc: "You possess a highly kinetic and action-oriented neural setup. You learn by doing, experiencing, and physically engaging with the world. You are fueled by momentum, speed, and tangible results.",
                    tips: [
                        "Find environments that reward adaptability and speed, rather than sitting idle at a desk.",
                        "Channel your boundless energy into high-stakes hobbies or rigorous physical disciplines.",
                        "Practice intentional patience. The biggest rewards in life take years, not days, to compound."
                    ]
                }
            };

            return profiles[maxCat];
        }
    </script>
