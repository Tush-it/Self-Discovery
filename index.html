<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Flow | Ultimate Glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border-light: rgba(255, 255, 255, 0.15);
            --glass-border-dark: rgba(0, 0, 0, 0.5);
            
            /* The Neon Colors */
            --neon-cyan: #00f2ff;
            --neon-purple: #bd00ff;
            
            /* Active Gradient: Cyan to Purple */
            --active-gradient: linear-gradient(135deg, rgba(0, 242, 255, 0.2) 0%, rgba(189, 0, 255, 0.2) 100%);
            
            --text-main: #ffffff;
            --text-muted: #8899ac;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- BACKGROUND CANVAS --- */
        #neuralCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            /* Subtle radial mask to make center brighter */
            background: radial-gradient(circle at center, transparent 0%, #050505 120%);
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            flex: 1;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 60px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -1px;
            color: var(--text-main);
            text-transform: uppercase;
        }
        .brand span { color: var(--neon-cyan); }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4rem;
            line-height: 1;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 50px;
            max-width: 600px;
        }

        /* --- 3D GLASS GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            /* 3D Glass Effect Borders */
            border-top: 1px solid var(--glass-border-light);
            border-left: 1px solid var(--glass-border-light);
            border-bottom: 1px solid var(--glass-border-dark);
            border-right: 1px solid var(--glass-border-dark);
            
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            
            /* Initial Animation State */
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 0.8s forwards;
        }

        /* Hover Effect: Lift and Glow */
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 242, 255, 0.1);
            border-color: rgba(255,255,255,0.3);
        }

        /* --- ACTIVE STATE (NEON GRADIENT) --- */
        .card.active-state {
            background: var(--active-gradient);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2), inset 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .card.active-state .card-num {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .card-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .card-question {
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.4;
            color: #e0e0e0;
        }

        /* Indicator Dot for "Answered" status */
        .status-dot {
            width: 8px; height: 8px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 30px; right: 30px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .card.has-answer .status-dot {
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: auto;
        }
        footer span { color: var(--neon-cyan); font-weight: 700; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .modal {
            width: 90%; max-width: 800px;
            background: #0a0a0a;
            border: 1px solid var(--glass-border-light);
            border-radius: 24px;
            padding: 50px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        .modal-overlay.open .modal { transform: scale(1); }

        .close-btn {
            position: absolute;
            top: 30px; right: 30px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover { color: #fff; }

        textarea {
            width: 100%; height: 250px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            margin-top: 30px;
            transition: 0.3s;
        }
        textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .btn-ghost:hover { border-color: #fff; background: rgba(255,255,255,0.05); }

        .btn-primary {
            background: linear-gradient(90deg, var(--neon-cyan), #00aaff);
            color: #000;
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(0, 242, 255, 0.3); }

        /* RECORDING ANIMATION */
        .btn-ghost.listening {
            border-color: #ff4d4d;
            color: #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* PRINT STYLES */
        @media print {
            body { background: white; color: black; display: block; }
            #neuralCanvas, nav, .btn, .modal-overlay { display: none; }
            .card { background: white; border: 1px solid #000; box-shadow: none; color: black; page-break-inside: avoid; }
            .card-question { color: black; font-weight: bold; }
            .card-num { color: black; }
        }
    </style>
</head>
<body>

    <canvas id="neuralCanvas"></canvas>

    <div class="container">
        <nav>
            <div class="brand">Neural <span>Flow.</span></div>
            <button class="btn btn-ghost" onclick="window.print()" style="padding: 10px 20px; font-size: 0.9rem;">
                <i class="fas fa-file-pdf"></i> Export PDF
            </button>
        </nav>

        <header>
            <h1>Self Discovery.</h1>
            <p class="subtitle">A neural interface for deep introspection. Select a node to begin.</p>
        </header>

        <div class="grid" id="grid">
            </div>
    </div>

    <footer>
        Designed by <span>Code Buddy</span>
    </footer>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle" style="font-size: 2rem; font-weight: 700; color: #fff;">Question</h2>
            <textarea id="modalInput" placeholder="Start typing your thoughts here..."></textarea>
            
            <div class="action-bar">
                <button class="btn btn-ghost" id="micBtn" onclick="toggleMic()">
                    <i class="fas fa-microphone"></i> <span id="micText">Dictate</span>
                </button>
                <button class="btn btn-primary" onclick="saveAnswer()">
                    Save Answer <i class="fas fa-check"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const questions = [
            { id: 1, text: "Jab tum free hote ho, naturally kya karte ho?" },
            { id: 2, text: "Kaunsa kaam karte waqt time ka pata hi nahi chalta?" },
            { id: 3, text: "Tum kis type ke logon ko dekh ke sochte ho – 'kaash mai bhi aisa hota'?" },
            { id: 4, text: "Agar fail hone ka darr hi na ho, tum kya try karte?" },
            { id: 5, text: "Log tumse aksar kis cheez me help maangte hain?" },
            { id: 6, text: "Tum zyada bolne wale ho, likhne wale ho, ya observe karne wale?" },
            { id: 7, text: "Kaunsi cheez ke liye tum bina paise ke bhi mehnat kar sakte ho?" }
        ];

        let activeId = null;
        let recognition = null;
        let isRecording = false;

        // --- INIT ---
        function init() {
            setupCanvas();
            initSpeech();
            renderGrid();
        }

        // --- RENDER GRID ---
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            questions.forEach((q, index) => {
                const saved = localStorage.getItem(`ans_${q.id}`);
                const hasAnswer = saved && saved.length > 0;
                const isActive = activeId === q.id;

                const card = document.createElement('div');
                // Logic: If active, it gets the neon gradient. If answered, it gets a dot.
                card.className = `card ${isActive ? 'active-state' : ''} ${hasAnswer ? 'has-answer' : ''}`;
                card.style.animationDelay = `${index * 0.1}s`;
                card.onclick = () => openModal(q.id);

                card.innerHTML = `
                    <div class="status-dot"></div>
                    <div>
                        <div class="card-num">NODE_0${q.id}</div>
                        <div class="card-question">${q.text}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- MODAL & LOGIC ---
        function openModal(id) {
            activeId = id;
            const q = questions.find(x => x.id === id);
            
            // Set Modal Content
            document.getElementById('modalTitle').innerText = q.text;
            document.getElementById('modalInput').value = localStorage.getItem(`ans_${id}`) || "";
            
            // Open Modal
            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('modalInput').focus();
            
            // Re-render grid so the clicked card turns "Active" immediately
            renderGrid();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            stopMicForce();
            activeId = null; // Remove active state when closing
            renderGrid();
        }

        function saveAnswer() {
            const val = document.getElementById('modalInput').value;
            localStorage.setItem(`ans_${activeId}`, val);
            closeModal();
        }

        // --- SPEECH RECOGNITION (FIXED) ---
        function initSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    let finalTrans = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) finalTrans += event.results[i][0].transcript;
                    }
                    if (finalTrans) {
                        const input = document.getElementById('modalInput');
                        // Smart spacing
                        input.value += (input.value && !input.value.endsWith(' ') ? ' ' : '') + finalTrans;
                    }
                };

                recognition.onerror = (e) => {
                    console.error("Mic Error:", e.error);
                    stopMicForce();
                    if(e.error === 'not-allowed') alert("Microphone access denied. Please check browser settings.");
                };
            }
        }

        function toggleMic() {
            if (!recognition) {
                alert("Voice dictation not supported in this browser.");
                return;
            }
            if (isRecording) {
                stopMicForce();
            } else {
                try {
                    recognition.start();
                    isRecording = true;
                    document.getElementById('micBtn').classList.add('listening');
                    document.getElementById('micText').innerText = "Listening...";
                } catch(e) {
                    console.log("Mic start error", e);
                }
            }
        }

        function stopMicForce() {
            isRecording = false;
            if (recognition) { try{ recognition.stop(); } catch(e){} }
            const btn = document.getElementById('micBtn');
            if(btn) {
                btn.classList.remove('listening');
                document.getElementById('micText').innerText = "Dictate";
            }
        }

        // --- BACKGROUND ANIMATION ---
        function setupCanvas() {
            const canvas = document.getElementById('neuralCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, p = [];

            const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize);
            resize();

            // Create particles
            for (let i = 0; i < 40; i++) {
                p.push({x: Math.random()*w, y: Math.random()*h, vx: (Math.random()-.5)*0.5, vy: (Math.random()-.5)*0.5});
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = "#00f2ff"; // Neon Cyan Dots
                
                p.forEach(pt => {
                    pt.x += pt.vx; pt.y += pt.vy;
                    if (pt.x < 0 || pt.x > w) pt.vx *= -1;
                    if (pt.y < 0 || pt.y > h) pt.vy *= -1;

                    // Draw Dot
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 1.5, 0, Math.PI*2);
                    ctx.fill();

                    // Draw Lines
                    p.forEach(pt2 => {
                        let dist = Math.hypot(pt.x - pt2.x, pt.y - pt2.y);
                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.moveTo(pt.x, pt.y);
                            ctx.lineTo(pt2.x, pt2.y);
                            ctx.strokeStyle = `rgba(0, 242, 255, ${1 - dist/150 * 0.8})`; // Fading Cyan Lines
                            ctx.stroke();
                        }
                    });
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        init();
    </script>
</body>
</html>
